name: Build custom hub image

on:
  release:
    types: [ published ]
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag (for one-off builds; does not update "latest")
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    # see https://github.com/docker/build-push-action
    steps:
      # Setup (see https://github.com/docker/build-push-action)
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Resolve the tags to push:
      # - release (created by release-please): <version> + latest
      # - push to main:                          latest-unstable
      # - manual:                                the tag given as input
      - name: Resolve image tags
        id: tags
        run: |
          case "${{ github.event_name }}" in
            release)
              # GITHUB_REF looks like "refs/tags/3.0.0"
              VERSION="${GITHUB_REF##*/}"
              echo "hub=blsq/openhexa-jupyterhub:${VERSION},blsq/openhexa-jupyterhub:latest" >> "$GITHUB_OUTPUT"
              echo "local=blsq/openhexa-jupyterhub:local-${VERSION}" >> "$GITHUB_OUTPUT"
              ;;
            push)
              echo "hub=blsq/openhexa-jupyterhub:latest-unstable" >> "$GITHUB_OUTPUT"
              echo "local=blsq/openhexa-jupyterhub:local-latest-unstable" >> "$GITHUB_OUTPUT"
              ;;
            workflow_dispatch)
              TAG="${{ github.event.inputs.tag }}"
              echo "hub=blsq/openhexa-jupyterhub:${TAG}" >> "$GITHUB_OUTPUT"
              echo "local=blsq/openhexa-jupyterhub:local-${TAG}" >> "$GITHUB_OUTPUT"
              ;;
          esac

      # Publish to Docker hub
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          context: jupyterhub
          file: jupyterhub/Dockerfile
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.tags.outputs.hub }}

      - name: Build and push for local deployment
        uses: docker/build-push-action@v7
        with:
          push: true
          context: jupyterhub
          file: jupyterhub/Dockerfile.dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.tags.outputs.local }}
